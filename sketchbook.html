<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground — HFYJ</title>
    <link rel="icon" id="favicon" type="image/svg+xml" href="./assets/favicon-light.svg">
    <script>
        // Settle the theme before anything paints. site.js runs at the end of
        // <body>, so by the time it could set this the light page would already
        // have flashed on screen; the attribute has to be on <html> before the
        // stylesheets below are ever applied. That is what makes this block
        // worth repeating verbatim in every page's <head>.
        //
        // The key, the two values and the shape of the read are index.html's,
        // and that is the whole mechanism carrying a reader's choice between
        // the home page and here. See the theme section at the top of site.js.
        (function () {
            var saved = null;
            // storage throws outright in some privacy modes rather than returning null
            try { saved = localStorage.getItem('theme'); } catch (err) {}
            // Only an explicit press is ever stored, so the OS preference gets
            // consulted exactly when there is no choice to honour instead.
            var theme = (saved === 'dark' || saved === 'light') ? saved
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            var favicon = document.getElementById('favicon');
            if (favicon) favicon.href = theme === 'dark' ? './assets/favicon-dark.svg' : './assets/favicon-light.svg';
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Figtree:wght@300;400;600&family=Mynerve&display=swap" rel="stylesheet">
    <!-- Before the first paint on purpose: if this page was opened from its
         carousel card, the cloth is held back until the card's face can
         expand into it. With no such hand-off waiting it does nothing. -->
    <script src="card-transition.js"></script>
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="skeleton.css">
    <!-- Ends the loading shimmer on each image as it arrives. In <head> and not
         deferred: the shimmer is on in the markup, so this only ever takes it
         off, and the sooner it can do that for a cached image the better. It
         also watches for images added later, which is the whole grid here. -->
    <script src="skeleton.js"></script>
    <link rel="stylesheet" href="sketchbook.css">
    <link rel="stylesheet" href="dice.css">
    <!-- The catalogue and the grass both sit on the critical path: the hand
         cannot be dealt without works.json, and the mat cannot paint without
         the albedo. Starting them here means they overlap the scripts below. -->
    <link rel="preload" href="assets/sketchbook/works.json" as="fetch" crossorigin>
    <link rel="preload" href="assets/sketchbook/felt/albedo.jpg" as="image">
    <!-- Warm the home document while this page is open, so leaving the
         table does not start the carousel's HTML from a cold fetch. -->
    <link rel="prefetch" href="index.html">
</head>
<body>

<nav id="topbar">
    <div class="topbar-left">
        <!-- #cards tells the home page the intro has already played -->
        <a href="index.html#cards">Home</a>
        <span class="sep">/</span>
        <span class="here">Playground</span>
    </div>
    <div class="topbar-right">
        <span>Brainstorm</span>
        <span class="sep-lg">/</span>
        <span>Ideas</span>
        <span class="sep-lg">/</span>
        <span>Inspirations</span>
    </div>
    <!-- Written out here rather than injected by site.js: the theme is already
         settled in <head>, so shipping the button in the markup puts it on
         screen in the first paint with no reflow, and it holds the bar's right
         edge even if site.js is slow or never arrives. site.js only wires it
         up — the sun/moon swap is pure CSS off <html>'s data-theme. -->
    <button id="theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false">
        <svg id="theme-icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 0.5V2.3M8 13.7V15.5M15.5 8H13.7M2.3 8H0.5M13.13 2.87L11.85 4.15M4.15 11.85L2.87 13.13M13.13 13.13L11.85 11.85M4.15 4.15L2.87 2.87" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <svg id="theme-icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M14.5 9.5A6.5 6.5 0 116.5 1.5 5.2 5.2 0 0014.5 9.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
    </button>
</nav>

<!-- Follows the pointer in place of the native cursor, on fine pointers only. -->
<div id="cursor-dot" aria-hidden="true"><span id="cursor-label"></span></div>

<main class="sketchbook">

    <!-- The table. #felt is the play area proper: the grass mat, the cards
         already played, and the fan waiting along its bottom edge. Everything
         inside it is positioned against it, so the landing coordinates
         sketchbook.js works out are simply its own box. -->
    <section id="table" aria-labelledby="table-heading">
        <!-- The painted name lives on #surface, not here: it has to pan with
             the cloth. aria-labelledby still finds it. -->
        <!-- data-cursor-none is on #felt as well as the two layers inside it
             because a pan takes pointer capture: while it runs, the hover
             events retarget to the capturing element, so a mark only on
             #surface and #played lets the dot pop back over the grabbing hand
             for the whole drag. -->
        <div id="felt" data-cursor-none>
            <!-- The table is bigger than the window onto it. #surface is the
                 table proper - the mat, and every card laid on it - and it
                 slides under #felt when you drag it, so there is more room to
                 push cards into than the screen shows. The hand is deliberately
                 outside it: a hand is held, not lying on the table, so it stays
                 put while the table moves under it. -->
            <!-- data-cursor-none: the mat draws a grab hand of its own, so the
                 dot stands down over it. It is on the element rather than
                 inherited by its subtree, so a card lying on the mat keeps the
                 dot; both layers are marked because #played covers #surface. -->
            <div id="surface" data-cursor-none>
                <!-- The mat. felt.js paints the grass onto this; without WebGL
                     the albedo tiled in sketchbook.css is what shows through. -->
                <canvas id="mat" aria-hidden="true"></canvas>
                <!-- Printed into the felt, the way a poker desk wears its name.
                     sketchbook.js sits it in the middle of the cloth; it then
                     travels with the table when you drag. -->
                <h1 id="table-heading">
                    <span class="mat-title">Playground</span>
                    <span class="mat-tag">where you can actually play</span>
                </h1>
                <!-- Played cards are appended here. -->
                <div id="played" aria-label="Cards on the table" data-cursor-none></div>
            </div>
            <!-- Exactly five, always. sketchbook.js fills and refills it. -->
            <div id="fan" role="group" aria-label="Your hand"></div>
        </div>
    </section>

    <section id="upcoming" aria-labelledby="upcoming-heading">
        <h2 id="upcoming-heading">Upcoming Cards <span id="upcoming-count" class="count">(…)</span></h2>
        <!-- Named by every tile through aria-describedby, so the arrow keys are
             mentioned once rather than twenty-one times. -->
        <p id="rack-help" class="visually-hidden">Cards can be reordered: drag one to another
            place in the rack, or move a focused card with the arrow keys.</p>
        <div id="grid"></div>
        <!-- What a reorder did, for a reader who cannot watch the card move.
             Both the drag and the arrow keys write here, so the two paths say
             the same thing. -->
        <p id="rack-status" class="visually-hidden" role="status" aria-live="polite"></p>
        <p id="grid-empty" hidden>The playground could not be loaded.</p>
    </section>

</main>

<!-- The card, opened. Empty and hidden until a card's expand control fills it:
     the card inside is built fresh each time and thrown away on close, so there
     is never a second copy of a work sitting in the document, and the rise
     animation has a new element to play on every time. -->
<div id="card-modal" hidden>
    <div class="modal-scrim"></div>
    <!-- No close control: a click anywhere off the card closes it, and so does
         Escape. Both are handled in sketchbook.js, on the modal itself, rather
         than by anything in here. -->
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="" tabindex="-1">
        <div id="modal-card"></div>
    </div>
</div>

<script src="analytics.js" defer></script>
<script src="site.js"></script>
<script src="sketchbook.js"></script>
<script src="felt.js"></script>
<script src="dice.js"></script>
</body>
</html>
